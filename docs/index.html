<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bila-G2P Studio</title><style>body{font:16px system-ui;background:#eef4f7;color:#183044;margin:0}main{max-width:900px;margin:auto;padding:28px}section{background:white;border:1px solid #cbdbe3;border-radius:14px;padding:20px;margin:16px 0}textarea{box-sizing:border-box;width:100%;min-height:100px;padding:12px;font:inherit}button,select,input{font:inherit;padding:9px;margin:5px 0}button{background:#086c75;color:white;border:0;border-radius:7px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}small{color:#456}</style><main><h1>Bila-G2P Studio</h1><p>CQN ↔ CVNSS4.0 · Phoneme IR · Audio adapters</p><section><label>Đầu vào <select id="mode"><option value="cqn">CQN</option><option value="cvss">CVNSS4.0</option></select></label><textarea id="source">Tôi yêu tiếng Việt</textarea><label><input type="checkbox" id="confirm"> Chấp nhận phân giải canonical nếu mơ hồ</label><button id="convert">Chuyển đổi</button><button id="speak">Nghe CQN (giọng trình duyệt)</button><pre id="out"></pre></section><section><h2>Âm vị thực</h2><label>URL backend G2P HTTPS cùng origin hoặc có CORS phù hợp<input id="endpoint" type="url" placeholder="https://.../phonemize" style="width:90%"></label><button id="g2p">Phân tích âm vị</button><pre id="phones"></pre><small>Giọng trình duyệt chỉ đọc CQN, không phải tổng hợp trực tiếp từ Phoneme IR. Không gửi văn bản đến backend nếu chưa bấm phân tích.</small></section><p><a href="https://github.com/xulytiengviet/bila-g2p">Mã nguồn và hướng dẫn</a></p></main><script type="module">import{prepare,BilaG2P,httpPhonemizer}from './sdk/index.js';const $=id=>document.getElementById(id);const options=()=>({input:$('mode').value,allowAmbiguous:$('confirm').checked});const run=()=>prepare($('source').value,options());$('convert').onclick=()=>{try{$('out').textContent=JSON.stringify(run(),null,2)}catch(e){$('out').textContent=e.message+'\n'+JSON.stringify(e.ambiguities||[],null,2)}};$('speak').onclick=()=>{try{const ir=run();if(!('speechSynthesis'in window))throw Error('Trình duyệt không hỗ trợ');const u=new SpeechSynthesisUtterance(ir.cqn);u.lang='vi-VN';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){$('out').textContent=e.message}};$('g2p').onclick=async()=>{try{const url=new URL($('endpoint').value);if(url.protocol!=='https:'&&!(url.protocol==='http:'&&['localhost','127.0.0.1'].includes(url.hostname)))throw Error('Cần HTTPS hoặc localhost');const g=new BilaG2P({phonemize:httpPhonemizer(url.href)});$('phones').textContent=JSON.stringify(await g.process($('source').value,options()),null,2)}catch(e){$('phones').textContent=e.message}};$('convert').click();</script></html>
