name: Bila lightweight wheel
on:
  push:
    branches: [main]
    paths: ['packaging/bila-wheel/**', 'docs/**', 'scripts/build_bila_wheel.py', 'tests/bila-wheel-smoke.py', '.github/workflows/bila-wheel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build twine
      - run: python scripts/build_bila_wheel.py
      - run: python -m twine check dist-bila/*
      - uses: actions/upload-artifact@v4
        with:
          name: bila-thin-wheel
          path: dist-bila/*.whl
  smoke:
    needs: wheel
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: bila-thin-wheel
          path: wheels
      - run: |
          python -m pip install --only-binary=:all: --find-links=wheels bila-g2p==1.0.0
      - run: python -m bila_g2p doctor
      - run: python tests/bila-wheel-smoke.py
  offline:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: bila-thin-wheel
          path: bundle
      - shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --dest bundle sea-g2p==0.10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/bila-wheel/*.bat bundle/
          Copy-Item packaging/bila-wheel/README.md bundle/
          Copy-Item LICENSE bundle/LICENSE-UPSTREAM.txt
          Copy-Item docs/LICENSE-MIT.txt bundle/
          python -m venv offline-test
          & offline-test/Scripts/python.exe -m pip install --no-index --only-binary=:all: --find-links=bundle bila-g2p==1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & offline-test/Scripts/python.exe tests/bila-wheel-smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path bundle/* -DestinationPath Bila-G2P-1.0.0-Windows-x64.zip
          Get-FileHash Bila-G2P-1.0.0-Windows-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Bila-G2P-1.0.0-Windows-x64
          path: Bila-G2P-1.0.0-Windows-x64.zip
